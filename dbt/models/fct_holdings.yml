version: 2
models:
- name: fct_holdings
  description: Acceptance fixture. One point in time drives the dimension lookup, declared once on the
    model. end_of_day means the version in force when the day closed, which is the assertion that proves
    the boundary is half open.
  columns:
  - name: holding_date
    tests:
    - not_null
  - name: account_id
    tests:
    - not_null
  - name: security_id
    tests:
    - not_null
  - name: security_key
    tests:
    - not_null
    - dbt_utils.relationships_where:
        to: ref('dim_security')
        field: security_key
        from_condition: security_key >= 0
  - name: ref_security_key
    tests:
    - not_null
    - dbt_utils.relationships_where:
        to: ref('dim_security')
        field: security_key
        from_condition: ref_security_key >= 0
  - name: quantity
    tests:
    - not_null
  - name: market_value
    tests:
    - not_null
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - holding_date
      - account_id
      - security_id
