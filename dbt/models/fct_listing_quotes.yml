version: 2
models:
- name: fct_listing_quotes
  description: 'Quotes resolved to a listing through a two-column natural key, exchange plus ticker, named
    mic and symbol on the fact. Exercises both halves of the lookup resolution at once: the dimension''s
    key columns differ in name from the fact''s, and there are two of them. The declared dimension_natural_key
    is checked against the dimension''s own.'
  columns:
  - name: quote_date
    tests:
    - not_null
  - name: mic
    tests:
    - not_null
  - name: symbol
    tests:
    - not_null
  - name: listing_key
    tests:
    - not_null
    - dbt_utils.relationships_where:
        to: ref('dim_listing')
        field: listing_key
        from_condition: listing_key >= 0
  - name: price
    tests:
    - not_null
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - quote_date
      - mic
      - symbol
