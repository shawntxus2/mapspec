version: 2
sources:
- name: vendor_ref
  schema: vendor_ref
  tables:
  - name: lst
    description: delimited source. seeds/listings.psv. landing is not dbt's job; see landing/
    meta:
      external_location: 'read_csv(''seeds/listings.psv'', delim=''|'', header=true, columns={''exchange_code'':
        ''varchar(8)'', ''ticker'': ''varchar(12)'', ''eff_date'': ''varchar(10)'', ''board_lot_txt'':
        ''varchar(10)''})'
      formatter: template
  - name: sec
    description: delimited source. seeds/securities$ref.psv. landing is not dbt's job; see landing/
    meta:
      external_location: 'read_csv(''seeds/securities$$ref.psv'', delim=''|'', header=true, columns={''security_id'':
        ''varchar(12)'', ''eff_date_txt'': ''varchar(10)'', ''ticker'': ''varchar(12)'', ''issuer_name'':
        ''varchar(200)'', ''sector_cd'': ''varchar(8)'', ''credit_rating'': ''varchar(8)'', ''par_value_txt'':
        ''varchar(30)'', ''maturity_dt_txt'': ''varchar(10)'', ''exchange_mic_txt'': ''varchar(4)''})'
      formatter: template
- name: reference
