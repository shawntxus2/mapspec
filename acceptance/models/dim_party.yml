spec_version: 1
project:
  name: reference_estate
  target_platform: duckdb

hash_policy:
  algorithm: sha256
  storage: hex
  hex_case: lower
  framing: length_prefix
  column_order: declared

target:
  layer: dimension
  name: dim_party
  schema: mart
  description: >
    A party, keyed on the pair (source_system, party_id). Two systems, alpha and beta, each
    issue party id P1 to a different party. The source carries source_system as a column, so
    both P1 rows coexist and a lookup that joins on party_id alone would match both. This is
    the fixture for the cross-system join hole.
  grain: [party_durable_key, valid_from]
  natural_key: [source_system, party_id]
  natural_key_stability: stable
  materialization: merge

durable_key:
  name: party_durable_key
  strategy: sequence
  type: int
  cardinality:
    entities: 100000
  assignment: sequence
  on_unknown: assign_new

scd:
  type: 2
  derivation: source_provided
  surrogate_key:
    name: party_key
    strategy: sequence
    cardinality:
      entities: 100000
      avg_versions: 5
    type: int
  effective_from: valid_from
  effective_to: valid_to
  bound: "[from, to)"
  open_sentinel: "9999-12-31 00:00:00.000"
  source_effective_from: "src.eff_date"
  source_timestamp_promotion: start_of_day
  on_duplicate_instant: error
  current_flag: is_current
  version_number: version_no
  change_hash: record_hash
  attribute_hash: attribute_hash

sources:
  - alias: src
    kind: delimited
    system: reference
    transport: sftp
    serialization: delimited
    uri: "seeds/parties.psv"
    delimiter: "|"
    header: true
    source_zone: "UTC"
    landing: native_read
    projection:
      - { name: source_system, from: 1, type: varchar(20) }
      - { name: party_id,      from: 2, type: varchar(12) }
      - { name: eff_date,      from: 3, type: varchar(10) }
      - { name: party_name,    from: 4, type: varchar(80) }

columns:
  - name: source_system
    type: varchar(20)
    nullable: false
    role: natural_key
    scd_behavior: { type: 1 }
    description: >
      Carried from the source, not a constant. This dimension genuinely holds rows from two
      systems, so source_system varies by row.
    transform:
      kind: direct
      source: "src.source_system"

  - name: party_id
    type: varchar(12)
    nullable: false
    role: natural_key
    scd_behavior: { type: 1 }
    transform:
      kind: direct
      source: "src.party_id"

  - name: party_name
    type: varchar(80)
    scd_behavior: { type: 2 }
    transform:
      kind: direct
      source: "src.party_name"
