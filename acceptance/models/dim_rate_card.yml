spec_version: 1
project:
  name: reference_estate
  target_platform: duckdb
  # DuckDB only, on purpose. haircut_pct casts with on_error: null, which DuckDB honors with
  # try_cast and PostgreSQL cannot (no try_cast, no clean guard), so the construct is
  # substituted on PostgreSQL and SUB001 would fail its build. Listing only duckdb keeps the
  # honored path covered on the platform that honors it, without carrying the substituted path
  # into the PostgreSQL suite. coverage.md records on_error: null as verified on duckdb and
  # substituted on postgres, which is exactly what this split makes true.
  build_platforms: [duckdb]

hash_policy:
  algorithm: sha256
  storage: hex
  hex_case: lower
  framing: length_prefix
  column_order: declared

target:
  layer: dimension
  name: dim_rate_card
  schema: mart
  description: >
    A collateral haircut card arriving as a batch snapshot. It exists to exercise one thing a
    clean seed never does: a cast that fails. The vendor sometimes ships a non-numeric placeholder
    where a rate is still being set, and on_error: null means that row carries a null rate rather
    than failing the load. DuckDB honors that with try_cast; the differential and the PostgreSQL
    suite never see this model, since PostgreSQL would substitute a cast that raises instead.
  grain: [rate_durable_key, valid_from]
  natural_key: [rate_id]
  natural_key_stability: stable
  materialization: merge

durable_key:
  name: rate_durable_key
  strategy: sequence
  type: int
  cardinality:
    entities: 100000
  assignment: sequence
  on_unknown: assign_new

scd:
  type: 2
  surrogate_key:
    name: rate_key
    strategy: sequence
    cardinality:
      entities: 100000
      avg_versions: 5
    type: int
  effective_from: valid_from
  effective_to: valid_to
  bound: "[from, to)"
  open_sentinel: "9999-12-31 00:00:00.000"
  source_effective_from: "rc.batch_date"
  source_timestamp_promotion: start_of_day
  on_duplicate_instant: error
  current_flag: is_current
  version_number: version_no
  change_hash: record_hash
  attribute_hash: attribute_hash

sources:
  - alias: rc
    kind: delimited
    system: reference
    transport: sftp
    serialization: delimited
    uri: "seeds/rate_card.psv"
    delimiter: "|"
    header: true
    source_zone: "UTC"
    landing: native_read
    projection:
      - { name: batch_date,  from: 1, type: varchar(10) }
      - { name: rate_id,     from: 2, type: varchar(8) }
      - { name: haircut_txt, from: 3, type: varchar(16) }

columns:
  - name: rate_id
    type: varchar(8)
    nullable: false
    role: natural_key
    scd_behavior: { type: 1 }
    transform:
      kind: direct
      source: "rc.rate_id"

  - name: haircut_pct
    type: numeric(9,4)
    scd_behavior: { type: 2 }
    additivity: non_additive
    description: >
      The point of the fixture. A row whose source value is a non-numeric placeholder casts to
      null rather than failing the load, which only holds because on_error is null and DuckDB
      has try_cast. The acceptance run asserts the placeholder row carries null and the real row
      carries its rate, so the null path is observed, not merely emitted.
    transform:
      kind: cast
      source: "rc.haircut_txt"
      to: numeric(9,4)
      rounding: half_up
      on_error: "null"
